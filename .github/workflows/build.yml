# Builds the light package (no language model inside, D34) on each system: electron-builder cannot build a
# macOS app on Windows, and node-llama-cpp installs the native AI engines of the system it runs on
# (Windows/Linux: CPU + Vulkan; macOS: Metal). CUDA engines are left out by package.json "build.files".
# Started by hand (Actions > build > Run workflow) or by a tag v*. The packages are attached to the run.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # no signing certificate yet
      - uses: actions/upload-artifact@v4
        with:
          name: jekyll-e-hyde-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
