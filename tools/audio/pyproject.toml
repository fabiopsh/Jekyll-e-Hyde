[project]
name = "jekyll-audio"
version = "0.1.0"
description = "Local AI soundtrack and audio pipeline (MusicGen) for the Jekyll e Hyde adventure game"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers>=4.40.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "piper-tts>=1.8.0",
    "kokoro>=0.9.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
