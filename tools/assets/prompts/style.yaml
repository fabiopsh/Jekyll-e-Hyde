# Style prefixes and suffixes, one block per asset kind. The prompt sent to SDXL is
#   prefix, <subject>, suffix
# where <subject> is the request text from data/assets.yaml (backgrounds, items) or the appearance sheet
# from prompts/characters.yaml plus pose/mood (characters, portraits).
#
# Originality rule (tools/assets/README.md): describe only what the book says plus generic choices of the
# period (Victorian London, 1880s). Never name films, actors, illustrators, comics, games or other
# adaptations, and never use the characters' names as a visual reference. Genre words such as
# "pixel art" or "game background" are allowed: they name a technique, not a work.
#
# SDXL reads at most 77 CLIP tokens per prompt: `generate.py --dry-run` prints the count of each prompt.

background:
  width: 1344
  height: 768
  prefix: "pixel art, adventure game background, victorian london 1880s"
  suffix: "flat colors, muted browns and dark greens"
  negative: >-
    people, person, figure, crowd, horse, carriage, car, modern, text, letters, writing, sign lettering,
    watermark, signature, frame, border, blurry, photo, realistic, 3d render, fisheye, tilted

character:
  width: 832
  height: 1216
  prefix: "pixel art, full body character sprite"
  # default pose for `pose: base`; a request can override it with its own `pose_text`
  pose: "side view facing right, standing upright, arms at sides, full figure"
  suffix: "single character, plain white background, flat colors, dark outline"
  negative: >-
    multiple views, character sheet, turnaround, two people, crowd, front view, back view, three quarter view,
    cut off, cropped, out of frame, shadow, floor, scenery, walking stick, umbrella, bag, text, watermark,
    blurry, realistic, photo, 3d render

portrait:
  width: 896
  height: 1152
  # Portraits are framed pictures with their own backdrop (postprocess.py frame_portrait): no cut-out.
  prefix: "pixel art, portrait, head and shoulders, whole hat visible"
  suffix: "plain dark brown backdrop, flat colors, dark outline"
  # mood id -> expression words; the file name is <character>_<mood>.png
  moods:
    neutral: "calm neutral expression"
    worried: "worried frown"
    stern: "stern severe look"
    shadowed: "face in deep shadow under the hat brim, pale chin lit from below"
  negative: >-
    multiple views, two people, full body, hands, cut off, out of frame, cropped hat, scenery, white background,
    text, watermark, blurry, realistic, photo, 3d render, smile

item:
  width: 1024
  height: 1024
  prefix: "pixel art, game inventory icon"
  suffix: "single object isolated on plain white background, centered, flat colors, dark outline"
  negative: >-
    multiple objects, many, pile, hand, person, table, scenery, shadow, cut off, out of frame, text,
    watermark, blurry, realistic, photo, 3d render

illustration:
  width: 896
  height: 1152
  # Pictures for the right-hand panel (docs/DECISIONI.md D20): full scene, no cut-out, centre crop 4:5,
  # reduced to 160x200. Rules of the book: Hyde only as a faceless black silhouette, violence off screen,
  # no readable writing.
  prefix: "pixel art, adventure game illustration, victorian london 1880s"
  suffix: "dramatic lighting, flat colors"
  negative: >-
    text, letters, writing, words, caption, signature, watermark, speech bubble, frame, border, panels,
    blood, gore, violence, weapon, modern, blurry, photo, realistic, 3d render

# Sampler settings: (steps, guidance, Pixel Art XL weight)
sampler:
  standard: {steps: 30, guidance: 7.0, lora_weight: 1.0}
  lcm: {steps: 8, guidance: 1.5, lora_weight: 1.2}

# Props (chapter 2): one piece of furniture or decoration, front view as in a room seen straight on at eye level,
# cut out (rembg) and stretched to the exact size of the request (`size: [w, h]`), then day palette, despeckle
# and a 1 px dark outline. The engine lights them (neutral even light here).
prop:
  width: 1024
  height: 1024
  prefix: "pixel art, game prop sprite, detailed victorian furniture, front view, straight on"
  suffix: "single object isolated on plain flat grey-green background, centered, even flat lighting, flat colors, dark outline"
  negative: >-
    multiple objects, room, interior, wall, floor, scenery, person, hand, shadow, side view, top view, perspective,
    cut off, cropped, out of frame, text, letters, watermark, blurry, realistic, photo, 3d render
