# Appearance sheet per character: the same `appearance` text goes into every prompt of that character
# (base pose in scene, portraits), so the design stays the same.
#
# `book` lists what the text says (with the source); `period` lists the choices that are NOT in the book
# and are only generic choices of the 1880s. When story/bible.md is ready, `book` must match it.
# Never put the character's name, or any film, actor, illustrator, comic or game, into `appearance`.
#
# `illustration` (optional) is the text used for `{<id>}` in an illustration subject (data/assets.yaml):
# the same look as `appearance` without what he would not wear in the scene (hat and shoes indoors), shorter
# so that the scene fits in the 77 CLIP tokens. Without it, `appearance` is used.
# `negative_extra` (optional) is appended to the negative prompt of every image of that character.
# `anim` (optional) tunes animate.py: row fractions from the top of the 64 px figure.
#   chest: rows above it sink by 1 px in idle_1 (breathing)
#   hip:   the legs start here; below it the figure is sheared for the walk

utterson:
  book:
    - "rugged countenance that was never lighted by a smile (ch. 1, r. 3-4)"
    - "lean, long, dusty, dreary and yet somehow lovable (ch. 1, r. 5-6)"
  period:
    - "middle-aged (age not given in ch. 1)"
    - "dark lawyer's clothes of the 1880s, top hat (clothes not given in ch. 1)"
    - "clean-shaven, greying hair (not in the book; chosen so sprite and portraits stay consistent)"
  appearance: >-
    tall lean middle-aged gentleman, long rugged unsmiling face, clean-shaven, greying hair,
    dusty dark grey frock coat, charcoal trousers, black top hat, black shoes
  illustration: >-
    tall lean middle-aged gentleman, long rugged unsmiling face, clean-shaven, greying hair,
    dark grey frock coat
  # "never lighted by a smile"; no beard so that every image shows the same face
  negative_extra: "smile, smiling, grin, beard, moustache"
  anim:
    chest: 0.30
    hip: 0.62

enfield:
  book:
    - "the young man (ch. 1, r. 220)"
    - "well-known man about town (ch. 1, r. 30)"
  period:
    - "young gentleman in his late twenties or early thirties (age not given in ch. 1)"
    - "fashionable light grey frock coat, pale waistcoat, dark trousers, top hat (clothes not given in ch. 1)"
    - "clean-shaven, well-groomed dark hair, lively face (scenery choice for consistency)"
  appearance: >-
    young elegant victorian gentleman, handsome clean-shaven lively face, well-groomed dark hair,
    tailored light grey frock coat, light waistcoat, dark trousers, black top hat, black shoes
  negative_extra: "beard, moustache, old, elderly, ragged, poor, smile, smiling, grin"
  anim:
    chest: 0.30
    hip: 0.60


# ---- Chapter 2 (story/chapters/02-ricerca-di-hyde.md, Profili personaggio; story/bible.md) ----------------------

lanyon:
  book:
    - "hale, dapper, rosy-faced, with a shock of hair prematurely white (ch. 2, r. 43-45)"
    - "noisy and decided manner (ch. 2, r. 43-45)"
  period:
    - "about fifty (age not given in ch. 2; the bible only fixes a school and college friend of Utterson)"
    - "well-cut black frock coat, pale waistcoat, neat cravat, dark trousers (bible: clothes are a design choice)"
    - "clean-shaven, stout build (not in the book; chosen for consistency)"
  appearance: >-
    hale dapper stout victorian gentleman about fifty, ruddy red face, shock of white hair, clean-shaven,
    black frock coat, pale waistcoat, dark trousers, black shoes
  illustration: >-
    hale stout gentleman about fifty, ruddy red face, shock of white hair, clean-shaven, black frock coat
  # no hat: a physician at home; the portrait prefix of the request leaves "whole hat visible" out
  negative_extra: "hat, top hat, cap, beard, moustache, thin, frail, bald, grey hair, sad"
  anim:
    chest: 0.30
    hip: 0.62

poole:
  book:
    - "elderly servant, well dressed (ch. 2, r. 234-235)"
    - "courteous, formal, reserved manner (ch. 2, r. 270)"
  period:
    - "black tail coat, white shirt, black tie, black trousers (bible: butler's dress is a design choice)"
    - "grey hair, clean-shaven (not in the book; chosen for consistency)"
  appearance: >-
    elderly dignified victorian butler, well dressed, grey hair, clean-shaven, black tail coat,
    white shirt, black tie, black trousers, black shoes
  negative_extra: "hat, top hat, cap, beard, moustache, young, smile, smiling, grin, red face"
  anim:
    chest: 0.30
    hip: 0.62

# Hyde: only what the book says (ch. 2 r. 148-149, 212-216): small, dwarfish, pale, very plainly dressed.
# NO nameable malformation (no hunchback, scar, fangs, claws, hair on the hands), nothing that reads as a
# "villain" (no cape, mask, odd hat). A plain gentleman's top hat is fine (bible: dress of ch. 9 is rich and sober).
hyde:
  book:
    - "small, dwarfish (ch. 2, r. 148, 212; ch. 8, r. 211)"
    - "very plainly dressed (ch. 2, r. 148-149)"
    - "pale (ch. 2, r. 212); deformity without any nameable malformation (ch. 2, r. 213)"
  period:
    - "plain dark clothes of the 1880s: short dark coat, dark trousers, a plain black top hat (bible: design choice)"
    - "age not given: a thin young-looking man (Utterson calls him a young man, r. 262)"
  appearance: >-
    small dwarfish pale thin man, plainly dressed in dark simple clothes, plain black top hat,
    short dark coat, dark trousers, black shoes
  negative_extra: "hunchback, scar, fangs, claws, horns, hairy, monster, villain, cape, cloak, mask, tall, fat, muscular, evil grin, smile, beard"
  anim:
    chest: 0.30
    hip: 0.58
