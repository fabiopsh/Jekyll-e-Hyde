  # ---- Title screen ------------------------------------------------------------------------------------
  # The by-street of loc_by_street at night, same composition: img2img from the exported day background.
  # Its layout (make_layouts.py) is that PNG at the generation size, darkened towards blue, with the gas lamp
  # lit, a light haze and the door in deeper shadow: from the day image alone SDXL gave dusk with unlit lamps
  # (strength 0.5) or lost the composition (strength 0.55 on a darkened copy).
  - id: loc_by_street_night
    kind: background
    variants: 8
    layout: layouts/loc_by_street_night.png
    strength: 0.45   # at 0.5 the variant chosen on 2026-10-16 had a window on the blind gable
    noise: 6
    source: >-
      story/bible.md, Luoghi: loc_by_street (night: cap. 2 r. 121-133, shops closed, lamps;
      "fogged city moon", cap. 2 r. 123-124); title screen, not a scene of the story
    subject: >-
      the same quiet street at night, deep blue night sky, light bluish fog, lit gas street lamp with golden
      light, shops closed and dark, blank gable wall, the shabby door in deep shadow
    negative_extra: "daylight, sunny, blue sky, sun"

