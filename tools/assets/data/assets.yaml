    layout: layouts/ill_c1_sunday_walk.png   # make_layouts.py
    strength: 0.75
    noise: 12
    subject: >-
      two gentlemen seen from behind walking side by side in silence down a quiet street on sunday,
      the taller one in a black frock coat, the other in a pale light grey frock coat, top hats
    negative_extra: "face, front view, crowd, carriage"

