# Every character that speaks or appears: name on screen, sprite, portrait, and the blip played while their
# text is typed (no voices, docs/DECISIONI.md D19). LLM personas of NPCs live in content/npcs/<id>.yaml.
# blip: 'typewriter' or { freq: Hz, wave: sine|triangle|sawtooth|square, cutoff: low-pass Hz }.

- id: narrator
  name: ""
  blip: typewriter

- id: utterson
  name: Utterson
  sprite: characters/utterson
  portrait: portraits/utterson_neutral
  blip: { freq: 118, wave: sawtooth, cutoff: 380 } # grave, measured

- id: enfield
  name: Enfield
  sprite: characters/enfield
  portrait: portraits/enfield_neutral
  blip: { freq: 245, wave: triangle, cutoff: 800 } # brighter, lively

- id: lanyon
  name: Lanyon
  sprite: characters/lanyon
  portrait: portraits/lanyon_neutral
  blip: { freq: 175, wave: triangle, cutoff: 650 } # hearty, boisterous

- id: poole
  name: Poole
  sprite: characters/poole
  portrait: portraits/poole_neutral
  blip: { freq: 140, wave: sine, cutoff: 520 } # soft, respectful

# "a husky, whispering and somewhat broken voice" (cap. 2 r. 215-216)
- id: hyde
  name: Hyde
  sprite: characters/hyde
  portrait: portraits/hyde_neutral
  blip: { freq: 92, wave: square, cutoff: 260 }
