# S 03.1-03.3 — the room of Jekyll's dinner, the guests gone, the two men by the fire. The book names no room and
# describes no furniture (Note di fedeltà): only the fire is in the text; the rest is a choice of drawing.
id: loc_jekyll_dining_room
name: La sala da pranzo del dottor Jekyll
background: backgrounds/loc_jekyll_dining_room
music: audio/music/mus_jekyll_dinner.mp3
ambience:
  sounds: [fire, clock]
# the floor stops in front of the furniture, deeper before the table and the fireplace
walkable: [[0, 194], [58, 194], [58, 206], [228, 206], [228, 194], [294, 194], [294, 204], [388, 204], [388, 194], [480, 194], [480, 268], [0, 268]]
# 1 m = 40 px: a door (2.1 m) is 85 px, Utterson about 75-85 px
scale: { far_y: 185, far: 1.05, near_y: 268, near: 1.3 }
# night after dinner: the candelabra on the table, the fire (D28)
lighting:
  ambient: "#5a4a52"
  lights:
    - { at: [144, 150], radius: 170, color: "#ffc480", intensity: 1.4, flicker: true, halo: 5 }
    - { at: [342, 168], radius: 160, color: "#ff9a48", intensity: 1.5, flicker: true }
# furniture and decoration, each its own picture (D29); depth 0 = always behind the characters
props:
  - { image: props/prop_jdin_rug, at: [250, 202], depth: 0 }
  - { image: props/prop_jdin_portrait, at: [86, 74], depth: 0 }
  - { image: props/prop_jdin_window, at: [234, 62], depth: 0 }
  - { image: props/prop_jdin_mirror, at: [320, 84], depth: 0 }
  - { image: props/prop_jdin_door, at: [18, 97] }
  - { image: props/prop_jdin_table, at: [64, 148] }
  - { image: props/prop_jdin_armchair_l, at: [262, 147] }
  - { image: props/prop_jdin_fireplace, at: [300, 129] }
  - { image: props/prop_jdin_armchair_r, at: [388, 147] }
  - { image: props/prop_jdin_bookcase, at: [438, 100] }
entries:
  table: [240, 226]
on_enter:
  - when: { not: { flag: c3_seen } }
    effects:
      - learn: F03.1
      - learn: F03.2
      - set: c3_seen
hotspots:
  - id: table
    name: La tavola
    shape: { x: 64, y: 140, w: 160, h: 56 }
    verbs:
      look:
        - effects:
            - narrate: "I resti di una delle piacevoli cene del dottore. Gli ospiti, tutti giudici di buon vino, se ne sono andati."
  - id: fireplace
    name: Il fuoco
    shape: { x: 300, y: 125, w: 84, h: 60 }
    walk_to: [342, 214]
    verbs:
      look:
        - effects:
            - narrate: "Il fuoco, tra le due poltrone: da una parte Utterson, dall'altra il dottor Jekyll."
  - id: armchair
    name: La poltrona di fronte a Jekyll
    shape: { x: 262, y: 147, w: 38, h: 44 }
    walk_to: [282, 212]
    verbs:
      look:
        - effects:
            - narrate: "La poltrona di Utterson, dal lato opposto del fuoco rispetto a quella di Jekyll."
      use:
        - when: { not: { flag: c3_prepared } }
          effects: [{ deduce: d03_thoughts }]
        - effects: [{ dialogue: d03_fireside }]
  - id: portrait
    name: Il ritratto
    shape: { x: 86, y: 74, w: 36, h: 46 }
    verbs:
      look:
        - effects:
            - narrate: "Il ritratto di un gentiluomo, in una pesante cornice dorata."
  - id: door
    name: La porta
    shape: { x: 18, y: 97, w: 44, h: 88 }
    verbs:
      use:
        - effects:
            - narrate: "Utterson è rimasto apposta: non se ne andrà prima di aver parlato."
npcs:
  - npc: jekyll
    at: [410, 228]
    facing: left
    talk: d03_fireside
    # free chat before the will is raised (docs/DESIGN.md §3)
    chat: true
    when: { not: { flag: c3_will_raised } }
  - npc: jekyll
    at: [410, 228]
    facing: left
    talk: d03_fireside
    chat: false
    when: { flag: c3_will_raised }
