# S 01.2 — the by-street on a Sunday (story/bible.md: loc_by_street). Coordinates are in the 480x270 game frame
# and must be retuned on the final background (assets/backgrounds/loc_by_street.png).
id: loc_by_street
name: La stradina
background: backgrounds/loc_by_street
music: audio/music/mus_by_street.mp3
# The chimney of the door building "generally smoking" (Enfield, D01.5.9); pigeons on the Sunday pavement.
ambience:
  smoke: [[230, 22]]
  birds: { area: { x: 300, y: 197, w: 150, h: 12 }, count: 4 }
  sounds: [wind, bells, footsteps]
walkable: [[0, 195], [480, 195], [480, 268], [0, 268]]
scale: { far_y: 195, far: 0.9, near_y: 268, near: 1.1 }
entries:
  west: [40, 230]
hotspots:
  - id: shops
    name: Le botteghe
    shape: { x: 0, y: 30, w: 175, h: 155 }
    verbs:
      look:
        - effects:
            - narrate: "La strada era piccola e quella che si dice quieta, ma nei giorni feriali faceva affari floridi. Le botteghe sembravano file di commesse sorridenti; anche di domenica la via risaltava nel vicinato squallido come un fuoco in una foresta."
              image: illustrations/ill_c1_shops
  - id: building
    name: L'edificio senza finestre
    shape: { x: 178, y: 15, w: 152, h: 95 }
    verbs:
      look:
        - effects:
            - narrate: "Un edificio sinistro spingeva in avanti il frontone sulla strada: due piani, nessuna finestra, soltanto una porta al pianterreno e sopra una fronte cieca di muro scolorito. Portava in ogni tratto i segni di una lunga e sordida incuria."
  - id: door
    name: La porta
    shape: { x: 236, y: 110, w: 46, h: 72 }
    walk_to: [259, 205]
    verbs:
      look:
        - when: { not: { flag: c1_door_story } }
          effects: [{ dialogue: d01_door_story }]
        - effects:
            # r. 58-64: the details of the door, from the book
            - narrate: "La porta, priva di campanello e di battente, era screpolata e macchiata. I vagabondi si rannicchiavano nel vano e accendevano fiammiferi sui pannelli; i bambini tenevano bottega sui gradini; uno scolaro aveva provato il coltello sulle modanature. E da quasi una generazione nessuno era venuto a scacciare quei visitatori o a riparare i loro guasti."
              image: illustrations/ill_c1_door_closeup
      use:
        - effects:
            - narrate: "Non c'è campanello, né battente. E Utterson non è uomo da bussare alle porte altrui."
  - id: court
    name: L'ingresso del cortile
    shape: { x: 288, y: 115, w: 42, h: 67 }
    verbs:
      look:
        # Proposta di gioco (story/chapters/01, S 01.5): after Enfield's description Utterson can see it himself.
        - when: { flag: c1_asked_signer }
          effects:
            - narrate: "Utterson guarda nel cortile, come Enfield lo ha descritto: tre finestre al primo piano, sempre chiuse ma pulite, nessuna sotto; un camino che fuma. Gli edifici sono così addossati che non si capisce dove uno finisca e l'altro cominci."
              image: illustrations/ill_c1_court
        - effects:
            - narrate: "Proprio accanto all'edificio, la fila delle case è interrotta dall'ingresso di un cortile."
npcs:
  - npc: enfield
    at: [90, 230]
    facing: right
    talk: d01_enfield
    chat: true
    follow: true # the Sunday walk: Enfield walks along with Utterson
