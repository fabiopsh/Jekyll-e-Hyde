# S 02.2 — Dr Lanyon's dining room in Cavendish Square, the same Sunday evening (story/bible.md).
# Coordinates follow the composition sketch tools/assets/data/layouts/loc_lanyon_dining_room.png.
id: loc_lanyon_dining_room
name: La sala da pranzo del dottor Lanyon
background: backgrounds/loc_lanyon_dining_room
music: audio/music/mus_lanyon.mp3
ambience:
  sounds: [clock]
# the floor stops in front of the furniture, deeper before the table and the fireplace
walkable: [[0, 194], [150, 194], [150, 206], [338, 206], [338, 194], [372, 194], [372, 204], [466, 204], [466, 194], [480, 194], [480, 268], [0, 268]]
# 1 m = 40 px: a door (2.1 m) is 85 px, Utterson about 75-85 px
scale: { far_y: 185, far: 1.05, near_y: 268, near: 1.3 }
# evening: candles on the table, the fire (D28)
lighting:
  ambient: "#6e6068"
  lights:
    - { at: [244, 150], radius: 180, color: "#ffc884", intensity: 1.4, flicker: true, halo: 5 }
    - { at: [420, 172], radius: 90, color: "#ff8a44", intensity: 1.0, flicker: true }
# furniture and decoration, each its own picture (D29); depth 0 = always behind the characters
props:
  - { image: props/prop_lanyon_rug, at: [140, 204], depth: 0 }
  - { image: props/prop_lanyon_portrait, at: [90, 78], depth: 0 }
  - { image: props/prop_lanyon_landscape, at: [222, 70], depth: 0 }
  - { image: props/prop_lanyon_mirror, at: [400, 92], depth: 0 }
  - { image: props/prop_lanyon_door, at: [18, 97] }
  - { image: props/prop_lanyon_sideboard, at: [76, 139] }
  - { image: props/prop_lanyon_table, at: [156, 146] }
  - { image: props/prop_lanyon_fireplace, at: [378, 133] }
entries:
  door: [60, 222]
on_enter:
  # r. 41-51
  - when: { not: { flag: c2_at_lanyon } }
    effects:
      - narrate: "Il solenne maggiordomo lo conosceva e gli diede il benvenuto; non gli fece fare anticamera, ma lo condusse dritto dalla porta alla sala da pranzo, dove il dottor Lanyon sedeva solo davanti al suo vino."
      - narrate: "Era un signore cordiale, in salute, elegante, dal viso rosso, con una zazzera di capelli prematuramente bianchi e modi rumorosi e decisi. Alla vista di Utterson balzò in piedi e lo accolse con entrambe le mani."
        image: illustrations/ill_c2_lanyon
      - narrate: "La cordialità, com'era nel carattere dell'uomo, aveva all'occhio qualcosa di teatrale; ma poggiava su un sentimento sincero. I due erano vecchi amici, compagni sia a scuola sia al college, entrambi rispettosi di sé e dell'altro e, cosa che non sempre ne consegue, uomini che godevano davvero l'uno della compagnia dell'altro."
        image: illustrations/ill_c2_lanyon
      - learn: F02.5
      - set: c2_at_lanyon
hotspots:
  - id: table
    name: La tavola
    shape: { x: 156, y: 140, w: 176, h: 56 }
    verbs:
      look:
        - effects:
            - narrate: "Il vino del dottor Lanyon, che stasera sedeva a tavola da solo."
  - id: sideboard
    name: Il camino
    shape: { x: 378, y: 125, w: 84, h: 60 }
    verbs:
      look:
        - effects:
            - narrate: "La casa di un medico illustre, che riceve la folla dei suoi pazienti."
  - id: lanyon_door
    name: La porta
    shape: { x: 18, y: 97, w: 44, h: 88 }
    walk_to: [40, 206]
    verbs:
      use:
        - when: { knows: F02.7 }
          effects: [{ dialogue: d02_sleepless }]
        - effects:
            - narrate: "Utterson non è venuto fin qui per una visita di cortesia: ha una domanda da fare."
npcs:
  - npc: lanyon
    at: [348, 224]
    facing: left
    talk: d02_lanyon
    chat: true
