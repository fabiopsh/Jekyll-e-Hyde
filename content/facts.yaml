# Facts of the story (ids and sources in story/chapters/). `text` is what the journal shows, written as
# Utterson knows it. `known_by` = NPCs who may tell it in free chat; `reveal_when` keeps the book's order.

# ---- chapter 1 ----
- id: F01.4
  text: "Nella stradina c'è un edificio senza finestre, con una sola porta senza campanello né battente, trascurata da anni."
  chapter: 1
  known_by: [enfield]
- id: F01.5
  text: "Alle tre di una notte d'inverno, Enfield vide un ometto calpestare con calma una bambina a un angolo di strada."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.6
  text: "Enfield riportò l'uomo sul posto; il medico disse che la bambina era più spaventata che ferita."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.7
  text: "Tutti provarono per quell'uomo un'avversione immediata; il medico avrebbe voluto ucciderlo."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.8
  text: "Minacciato di scandalo, l'uomo accettò di pagare cento sterline alla famiglia della bambina."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.9
  text: "L'uomo aprì la porta con una chiave e tornò con dieci sterline in oro e un assegno firmato da un nome notissimo, che Enfield non vuole dire."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.10
  text: "Chi ha firmato l'assegno abita in una qualche piazza; Enfield lo descrive come rispettabile, celebre e benefico."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_asked_signer }
- id: F01.11
  text: "La mattina dopo, in banca, l'assegno risultò autentico."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.12
  text: "Enfield sospetta un ricatto e chiama quel luogo «Casa del Ricatto», ma ammette che non spiega tutto."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.13
  text: "Enfield, per regola, non fa domande: «più la cosa ha l'aria di una faccenda losca, meno chiedo»."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_door_story }
- id: F01.14
  text: "L'edificio sembra a malapena una casa: una sola porta, tre finestre chiuse ma pulite sul cortile, un camino che fuma."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_asked_signer }
- id: F01.15
  text: "L'uomo della storia di Enfield si chiama Hyde."
  chapter: 1
  known_by: [enfield]
  reveal_when: { flag: c1_asked_signer }
- id: F01.16
  text: "Hyde dà una forte sensazione di deformità, ma nessuno sa dire dove: Enfield non riesce a descriverlo."
  chapter: 1
  known_by: [enfield]
  reveal_when: { knows: F01.15 }
- id: F01.17
  text: "Conoscevo già il nome di Hyde prima del racconto di Enfield."
  chapter: 1
- id: F01.18
  text: "Hyde ha ancora la chiave di quella porta: Enfield gliel'ha vista usare meno di una settimana fa."
  chapter: 1
  known_by: [enfield]
  reveal_when: { knows: F01.15 }
- id: F01.19
  text: "Enfield e io abbiamo fatto un patto: non parlare mai più di questa storia."
  chapter: 1

# ---- chapter 2 ----
- id: F02.1
  text: "Il testamento di Jekyll è olografo: Utterson lo custodisce, ma si era rifiutato di aiutare a scriverlo."
  chapter: 2
- id: F02.2
  text: "Alla morte di Jekyll tutti i suoi beni vanno al suo «amico e benefattore Edward Hyde»."
  chapter: 2
- id: F02.3
  text: "Se Jekyll scompare o resta assente senza spiegazione per più di tre mesi, Hyde prende il suo posto senza indugio."
  chapter: 2
- id: F02.4
  text: "Utterson pensava che il testamento fosse follia; ora teme che sia disonore."
  chapter: 2
- id: F02.5
  text: "Utterson e Lanyon sono vecchi amici, compagni di scuola e di college."
  chapter: 2
  known_by: [lanyon]
- id: F02.6
  text: "Da più di dieci anni Lanyon vede pochissimo Jekyll: le sue idee gli sembrano «stupidaggini non scientifiche»."
  chapter: 2
  known_by: [lanyon]
- id: F02.7
  text: "Lanyon non ha mai sentito nominare Hyde: «è venuto dopo il mio tempo»."
  chapter: 2
  known_by: [lanyon]
  reveal_when: { flag: c2_asked_friends }
- id: F02.8
  text: "Dopo una notte insonne, Utterson vuole a ogni costo vedere il volto del vero signor Hyde."
  chapter: 2
- id: F02.9
  text: "Utterson fa la guardia alla porta della stradina la mattina, a mezzogiorno e di notte."
  chapter: 2
- id: F02.10
  text: "Una notte gelida, verso le dieci, un uomo piccolo e vestito semplicemente arriva alla porta con una chiave in mano."
  chapter: 2
- id: F02.11
  text: "Il dottor Jekyll quella notte non è in casa."
  chapter: 2
  known_by: [poole]
  reveal_when: { flag: c2_poole_back }
- id: F02.12
  text: "Hyde ora sa chi è Utterson: il signor Utterson di Gaunt Street, vecchio amico di Jekyll."
  chapter: 2
- id: F02.13
  text: "Hyde ha dato a Utterson il suo indirizzo: il numero di una strada di Soho."
  chapter: 2
- id: F02.14
  text: "Utterson ha visto in faccia il signor Hyde, per alcuni secondi: lo riconoscerebbe."
  chapter: 2
- id: F02.15
  text: "Quando Utterson nomina Jekyll come amico comune, Hyde gli dà del bugiardo e sparisce nella casa."
  chapter: 2
- id: F02.16
  text: "Hyde è pallido e nanesco, dà un'impressione di deformità senza alcuna malformazione definibile, ha un sorriso sgradevole e una voce rauca, sussurrante e un po' spezzata."
  chapter: 2
- id: F02.17
  text: "Utterson prova per Hyde un disgusto, una repulsione e una paura che non sa spiegare: «sembra appena umano»."
  chapter: 2
- id: F02.18
  text: "La casa di Jekyll è la seconda dall'angolo della piazza dietro la stradina, l'unica ancora abitata per intero."
  chapter: 2
- id: F02.19
  text: "Il signor Hyde ha una chiave ed entra dalla vecchia porta della sala di dissezione."
  chapter: 2
  known_by: [poole]
  reveal_when: { flag: c2_poole_back }
- id: F02.20
  text: "Tutta la servitù di Jekyll ha l'ordine di obbedire al signor Hyde."
  chapter: 2
  known_by: [poole]
  reveal_when: { knows: F02.19 }
- id: F02.21
  text: "Hyde non cena mai in casa di Jekyll; per lo più entra ed esce dal laboratorio."
  chapter: 2
  known_by: [poole]
  reveal_when: { knows: F02.20 }
- id: F02.22
  text: "Utterson sospetta che Jekyll sia perseguitato da un vecchio peccato di gioventù (è una sua ipotesi)."
  chapter: 2
- id: F02.23
  text: "Utterson teme che Hyde, se sa del testamento, diventi impaziente di ereditare; vuole intervenire, se Jekyll glielo permetterà."
  chapter: 2
